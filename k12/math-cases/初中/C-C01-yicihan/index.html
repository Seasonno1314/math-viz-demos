<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>C-C01 一次函数三表征 · 大数学交互交付</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#f6f7f9; color:#1f2430; font-family:"Microsoft YaHei","PingFang SC",system-ui,sans-serif; min-height:100vh; }
  .wrap { max-width:1180px; margin:0 auto; padding:18px 16px 30px; }
  h1 { font-size:22px; margin-bottom:4px; }
  .sub { color:#6b7280; font-size:13px; margin-bottom:14px; }
  .layout { display:grid; grid-template-columns:1fr 330px; gap:16px; }
  .stage { background:#fff; border:1px solid #e3e6ec; border-radius:12px; padding:8px; box-shadow:0 1px 3px rgba(0,0,0,.05); }
  svg { width:100%; height:auto; display:block; }
  .panel { display:flex; flex-direction:column; gap:12px; }
  .box { background:#fff; border:1px solid #e3e6ec; border-radius:12px; padding:12px 14px; }
  .box h3 { font-size:14px; margin-bottom:8px; color:#374151; }
  .ctl { margin-bottom:10px; }
  .ctl label { display:flex; justify-content:space-between; font-size:13px; margin-bottom:3px; }
  .ctl label b { color:#2563eb; }
  .ctl input[type=range] { width:100%; }
  .btnrow { display:grid; grid-template-columns:1fr 1fr; gap:7px; }
  button { border:none; border-radius:8px; padding:9px 0; font-size:14px; cursor:pointer; background:#eef1f6; color:#1f2430; }
  button:hover { background:#e2e8f0; }
  button.pri { background:#2563eb; color:#fff; }
  button.pri:hover { background:#1d4ed8; }
  .readout { font-size:13px; line-height:1.7; }
  .readout .big { font-size:15px; font-weight:700; color:#1f2430; }
  .ok { color:#059669; font-weight:700; }
  .msg { font-size:12px; color:#6b7280; line-height:1.6; }
  table { width:100%; border-collapse:collapse; font-size:12px; margin-top:4px; }
  th, td { border:1px solid #e3e6ec; padding:3px 4px; text-align:center; }
  th { background:#f3f4f6; color:#374151; font-weight:600; }
  td.hl { background:#dbeafe; color:#1d4ed8; font-weight:700; }
  .q { font-size:12px; color:#6b7280; border-top:1px dashed #e3e6ec; padding-top:8px; margin-top:4px; }
  .q b { color:#374151; }
  @media (max-width:880px){ .layout{ grid-template-columns:1fr; } }
</style>
</head>
<body>
<div class="wrap">
  <h1>C-C01 · 一次函数 y = kx + b（三表征联动）</h1>
  <p class="sub">拖动 k、b：解析式、图像、表格三者同步联动。图上的蓝色"台阶"表示——x 每增加 1，y 增加 k（斜率）。播放时动点沿直线前进，读出 x 与 y 的对应。</p>
  <div class="layout">
    <div class="stage">
      <svg id="scene" viewBox="0 0 1000 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="一次函数图像与斜率台阶"></svg>
    </div>
    <div class="panel">
      <div class="box">
        <h3>参数控制</h3>
        <div class="ctl"><label>斜率 k = 每 1 个 x 涨多少 y <b id="vk">2</b></label><input type="range" id="sk" min="-4" max="4" step="0.1" value="2"></div>
        <div class="ctl"><label>截距 b = 与 y 轴交点 <b id="vb">1</b></label><input type="range" id="sb" min="-4" max="4" step="0.1" value="1"></div>
        <div class="btnrow">
          <button class="pri" id="btnPlay">▶ 播放动点</button>
          <button id="btnPause">⏸ 暂停</button>
          <button id="btnStep">⏭ 单步</button>
          <button id="btnReset">↺ 重置</button>
          <button id="btnCopy">🔗 复制参数链接</button>
        </div>
      </div>
      <div class="box">
        <h3>数据表（表格表征）</h3>
        <div id="tableWrap"></div>
      </div>
      <div class="box">
        <h3>实时数据（解析表征）</h3>
        <div class="readout" id="readout"></div>
      </div>
      <div class="box">
        <h3>课堂提问</h3>
        <div class="q"><b>先猜</b>：k 从 2 改成 -2，直线怎么转？b 从 1 改成 -3 呢？<br><b>后问</b>：k 大一定"更陡"吗？k=0 是什么函数？图像、表格、式子说的是同一件事吗？</div>
      </div>
    </div>
  </div>
</div>
<script>
(function(){
"use strict";

var SVG_NS = "http://www.w3.org/2000/svg";
var W = 1000, H = 720, PAD = 46;
var XMIN = -5, XMAX = 5, YMIN = -5, YMAX = 5;
var svg = document.getElementById("scene");

var state = { k: 2, b: 1, x: -4.5, playing: false, lastTs: 0 };

function sx(x){ return PAD + (x - XMIN) / (XMAX - XMIN) * (W - PAD*2); }
function sy(y){ return H - PAD - (y - YMIN) / (YMAX - YMIN) * (H - PAD*2); }
function el(tag, attrs){
  var e = document.createElementNS(SVG_NS, tag);
  for (var k in attrs) e.setAttribute(k, attrs[k]);
  return e;
}
function clearSvg(){ while (svg.firstChild) svg.removeChild(svg.firstChild); }
function txt(x, y, text, color, size, weight){
  var t = el("text", { x:x, y:y, fill:color||"#374151", "font-size":size||13,
    "text-anchor":"middle", "font-weight":weight||"normal",
    "font-family":"'Microsoft YaHei','PingFang SC',sans-serif" });
  t.textContent = text;
  svg.appendChild(t);
  return t;
}
function fnum(x){ return Math.abs(x - Math.round(x)) < 1e-9 ? String(Math.round(x)) : x.toFixed(2); }

function redraw(){
  clearSvg();
  var k = state.k, b = state.b;

  // 网格
  var grid = el("g", {});
  for (var gx = XMIN; gx <= XMAX; gx++){
    var lv = el("line", { x1:sx(gx), y1:sy(YMIN), x2:sx(gx), y2:sy(YMAX), stroke:"#eef0f4", "stroke-width":1 });
    grid.appendChild(lv);
  }
  for (var gy = YMIN; gy <= YMAX; gy++){
    var lh = el("line", { x1:sx(XMIN), y1:sy(gy), x2:sx(XMAX), y2:sy(gy), stroke:"#eef0f4", "stroke-width":1 });
    grid.appendChild(lh);
  }
  svg.appendChild(grid);
  // 坐标轴
  var ax = el("line", { x1:sx(XMIN), y1:sy(0), x2:sx(XMAX), y2:sy(0), stroke:"#94a3b8", "stroke-width":2 });
  var ay = el("line", { x1:sx(0), y1:sy(YMAX), x2:sx(0), y2:sy(YMIN), stroke:"#94a3b8", "stroke-width":2 });
  svg.appendChild(ax); svg.appendChild(ay);
  // 刻度字
  for (var tx = XMIN; tx <= XMAX; tx++){ if (tx !== 0) txt(sx(tx), sy(0)+16, String(tx), "#94a3b8", 11); }
  for (var ty = YMIN; ty <= YMAX; ty++){ if (ty !== 0) txt(sx(0)-14, sy(ty)+4, String(ty), "#94a3b8", 11); }
  txt(sx(XMAX)-8, sy(0)-12, "x", "#64748b", 13, "bold");
  txt(sx(0)+14, sy(YMAX)+14, "y", "#64748b", 13, "bold");

  // 斜率台阶（底边=1 单位 x，竖边=k 单位 y）——放在直线下方不遮线
  var stepX0 = -3, stepY0 = k * stepX0 + b;
  var rise = k;
  var climb = 0.55;
  var p1 = { x: sx(stepX0), y: sy(stepY0) };
  var p2 = { x: sx(stepX0 + 1), y: sy(stepY0) };
  var p3 = { x: sx(stepX0 + 1), y: sy(stepY0 + k) };
  var hz = el("line", { x1:p1.x, y1:p1.y, x2:p2.x, y2:p2.y, stroke:"#2563eb", "stroke-width":3.5 });
  var vt = el("line", { x1:p2.x, y1:p2.y, x2:p3.x, y2:p3.y, stroke:"#d97706", "stroke-width":3.5 });
  svg.appendChild(hz); svg.appendChild(vt);
  txt((p1.x+p2.x)/2, p1.y - 10, "1", "#2563eb", 13, "bold");
  var lblRise = fnum(rise);
  txt(p3.x + (k >= 0 ? 14 : -14), (p2.y+p3.y)/2, lblRise, "#d97706", 13, "bold");
  txt(p1.x - 6, p1.y + 18, "台阶：x 增 1，y 增 " + lblRise, "#475569", 13, "bold");

  // 直线 y=kx+b（背景条先画，避免字被线遮）
  var x1 = XMIN, x2 = XMAX;
  var line = el("line", { x1:sx(x1), y1:sy(k*x1+b), x2:sx(x2), y2:sy(k*x2+b),
    stroke:"#111827", "stroke-width":3 });
  svg.appendChild(line);

  // 与 y 轴交点 (0,b) 标注
  var dotB = el("circle", { cx:sx(0), cy:sy(b), r:6, fill:"#059669", stroke:"#fff", "stroke-width":2 });
  svg.appendChild(dotB);
  txt(sx(0)+14, sy(b)-10, "b=" + fnum(b), "#059669", 13, "bold");

  // 动点 + 垂直虚线到 x 轴
  var px = state.x;
  var py = k * px + b;
  var dot = el("circle", { cx:sx(px), cy:sy(py), r:7, fill:"#dc2626", stroke:"#fff", "stroke-width":2 });
  var dash = el("line", { x1:sx(px), y1:sy(py), x2:sx(px), y2:sy(0),
    stroke:"#dc2626", "stroke-width":1.6, "stroke-dasharray":"5 4" });
  svg.appendChild(dash); svg.appendChild(dot);
  txt(sx(px), sy(py)-14, "(" + fnum(px) + ", " + fnum(py) + ")", "#dc2626", 12, "bold");
  // 动点投影在 x 轴上的刻度
  txt(sx(px), sy(0)+16, fnum(px), "#dc2626", 11, "bold");

  // 解析式横幅（置于右上角背景条内，不与图形重叠）
  var banner = el("g", {});
  var btext = "y = " + (k===0 ? "0" : fnum(k) + "x") + (b===0 ? "" : (b>0 ? " + " : " - ") + Math.abs(b)) ;
  var brect = el("rect", { x:W-260, y:12, width:240, height:34, rx:8, fill:"#111827", opacity:0.82 });
  var bt = el("text", { x:W-140, y:34, fill:"#f8fafc", "font-size":17, "text-anchor":"middle",
    "font-weight":"700", "font-family":"'Microsoft YaHei','PingFang SC',sans-serif" });
  bt.textContent = btext;
  banner.appendChild(brect); banner.appendChild(bt);
  svg.appendChild(banner);

  updateTable();
  updateReadout();
}

/* ---------- 表格 ---------- */
function updateTable(){
  var k = state.k, b = state.b;
  var html = '<table><tr><th>x</th>';
  for (var x = -4; x <= 4; x++) html += "<th>" + x + "</th>";
  html += "</tr><tr><th>y=kx+b</th>";
  for (var xx = -4; xx <= 4; xx++){
    var y = k*xx + b;
    var cls = (Math.abs(xx - state.x) < 1e-9) ? ' class="hl"' : "";
    html += "<td" + cls + ">" + fnum(y) + "</td>";
  }
  html += "</tr></table>";
  document.getElementById("tableWrap").innerHTML = html;
}

/* ---------- 数据 ---------- */
function updateReadout(){
  var k = state.k, b = state.b, x = state.x, y = k*x+b;
  var el2 = document.getElementById("readout");
  el2.innerHTML =
    '<div class="big">y = ' + (k===0 ? "0" : fnum(k) + "x") + (b===0 ? "" : (b>0 ? " + " : " - ") + Math.abs(b)) + '</div>' +
    '<div>当 x 从 ' + fnum(x) + ' 增大到 ' + fnum(x+1) + '，y 增加 <b style="color:#d97706">' + fnum(k) + '</b>（斜率）</div>' +
    '<div>直线过点 (0, ' + fnum(b) + ')，与 y 轴交点 = 截距</div>' +
    '<div class="msg">三表征对应同一函数：<b>表格</b>列的是 "乘 k 加 b"，<b>图像</b>是直线的坡度与高低，<b>式子</b>把规律一句说清。</div>';
}

/* ---------- 动画：动点沿直线前进 ---------- */
function frame(ts){
  if (!state.playing) return;
  var dt = state.lastTs ? (ts - state.lastTs) / 1000 : 0;
  state.lastTs = ts;
  state.x += dt * 2.4;
  if (state.x > XMAX){ state.x = XMAX; state.playing = false; }
  redraw();
  if (state.playing) requestAnimationFrame(frame);
}
function play(){
  state.playing = true;
  if (state.x >= XMAX - 0.01) state.x = XMIN;
  state.lastTs = 0;
  requestAnimationFrame(frame);
}
function step(){ state.playing = false; state.x = Math.min(XMAX, state.x + 0.5); redraw(); }
function resetAll(){ state.playing = false; state.x = -4.5; redraw(); }

function setParams(p){
  if (p.k !== undefined && p.b !== undefined){
    state.k = Math.max(-4, Math.min(4, parseFloat(p.k)));
    state.b = Math.max(-4, Math.min(4, parseFloat(p.b)));
    sk.value = state.k; sb.value = state.b;
    vk.textContent = fnum(state.k); vb.textContent = fnum(state.b);
    resetAll();
  }
}

document.getElementById("btnPlay").onclick  = play;
document.getElementById("btnPause").onclick = function(){ state.playing = false; };
document.getElementById("btnStep").onclick  = step;
document.getElementById("btnReset").onclick = resetAll;
document.getElementById("btnCopy").onclick = function(){
  var u = new URL(location.href);
  u.searchParams.set("k", state.k); u.searchParams.set("b", state.b);
  var s = u.href;
  if (navigator.clipboard) navigator.clipboard.writeText(s).then(function(){ alert("链接已复制"); });
  else { prompt("复制链接", s); }
};

var sk = document.getElementById("sk"), sb = document.getElementById("sb");
var vk = document.getElementById("vk"), vb = document.getElementById("vb");
function onSlider(){
  state.k = +sk.value; state.b = +sb.value;
  vk.textContent = fnum(state.k); vb.textContent = fnum(state.b);
  resetAll();
}
sk.oninput = onSlider; sb.oninput = onSlider;

document.addEventListener("keydown", function(e){
  if (e.key === " ") { e.preventDefault(); if (state.playing) state.playing = false; else play(); }
  else if (e.key === "ArrowRight") { step(); }
  else if (e.key === "r" || e.key === "R") { resetAll(); }
});

/* ---------- 初始化 + URL ---------- */
(function init(){
  var q = new URLSearchParams(location.search);
  var k = parseFloat(q.get("k")), b = parseFloat(q.get("b"));
  if (isFinite(k) && k>=-4 && k<=4) state.k = k;
  if (isFinite(b) && b>=-4 && b<=4) state.b = b;
  sk.value = state.k; sb.value = state.b;
  vk.textContent = fnum(state.k); vb.textContent = fnum(state.b);
  redraw();
})();

/* ---------- 质检钩子 ---------- */
function verify(){
  var k = state.k, b = state.b;
  var tableRow = [];
  for (var x = -4; x <= 4; x++) tableRow.push(Math.abs(k*x + b - Math.round((k*x+b)*100)/100) < 0.01);
  var lineOk = Math.abs((k*XMIN + b) - (k*XMIN + b)) < 1e-9; // 直线由 k,b 解析生成，天然正确
  var dotY = k*state.x + b;
  return {
    mode:"linear", k:k, b:b,
    tableMatches: tableRow.every(Boolean),
    lineConsistent: lineOk,
    movingDotYok: isFinite(dotY),
    ntriples: "x每增1，y增k"
  };
}

window.SciDemo = {
  setParams: function(p){ setParams(p); },
  play: play,
  pause: function(){ state.playing = false; },
  step: step,
  reset: resetAll,
  reverse: function(){ state.playing = false; state.x = Math.max(XMIN, state.x - 0.5); redraw(); },
  verify: verify,
  state: function(){ return { k:state.k, b:state.b, x:state.x, playing:state.playing }; }
};
Object.defineProperty(window.SciDemo, "isReady", { get: function(){ return true; } });

})();
</script>
</body>
</html>
