<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>C-J06 圆周角定理 · 大数学交互交付</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0f1923;--panel:#162029;--border:#263545;--accent:#4fc3f7;
  --accent2:#ff8a65;--text:#e0e8f0;--dim:#7a8a9a;--green:#66bb6a;
  --red:#ef5350;--radius:8px;
}
html,body{height:100%;font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);overflow:hidden}
body{display:flex;flex-direction:column}

.title-bar{
  height:48px;min-height:48px;display:flex;align-items:center;
  padding:0 24px;background:var(--panel);border-bottom:1px solid var(--border);
  font-size:15px;font-weight:600;letter-spacing:.5px;gap:12px;
}
.title-bar .tag{font-size:11px;padding:2px 8px;border-radius:4px;background:var(--accent);color:#000;font-weight:700}

.main{flex:1;display:grid;grid-template-columns:1fr 310px;overflow:hidden;min-height:0;max-width:1180px;width:100%;margin:0 auto}
@media(max-width:880px){.main{grid-template-columns:1fr;grid-template-rows:1fr auto}}

.svg-wrap{position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;background:#0d151e}
.svg-wrap svg{width:100%;height:100%;display:block}

.panel{
  background:var(--panel);border-left:1px solid var(--border);
  overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:14px;
  scrollbar-width:thin;scrollbar-color:var(--border) transparent;
}
@media(max-width:880px){
  .panel{border-left:none;border-top:1px solid var(--border);max-height:45vh}
}

.section-title{font-size:12px;font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:1px;margin-bottom:2px}
.card{background:rgba(255,255,255,.03);border:1px solid var(--border);border-radius:var(--radius);padding:12px}

.slider-group{display:flex;flex-direction:column;gap:6px}
.slider-label{display:flex;justify-content:space-between;font-size:12px;color:var(--dim)}
.slider-label span:last-child{color:var(--text);font-weight:600;font-variant-numeric:tabular-nums}
input[type=range]{
  -webkit-appearance:none;width:100%;height:6px;border-radius:3px;
  background:var(--border);outline:none;cursor:pointer;
}
input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;width:16px;height:16px;border-radius:50%;
  background:var(--accent);border:2px solid var(--bg);cursor:grab;
}
input[type=range]::-moz-range-thumb{
  width:16px;height:16px;border-radius:50%;
  background:var(--accent);border:2px solid var(--bg);cursor:grab;
}

.btn-row{display:flex;gap:6px;flex-wrap:wrap}
.btn{
  flex:1;min-width:60px;padding:7px 0;border:1px solid var(--border);
  border-radius:var(--radius);background:rgba(255,255,255,.04);
  color:var(--text);font-size:12px;font-weight:600;cursor:pointer;
  transition:background .15s,border-color .15s;text-align:center;white-space:nowrap;
}
.btn:hover{background:rgba(79,195,247,.12);border-color:var(--accent)}
.btn.primary{background:var(--accent);color:#000;border-color:var(--accent)}
.btn.primary:hover{background:#6dd0fa}
.btn.danger{border-color:var(--red);color:var(--red)}
.btn.danger:hover{background:rgba(239,83,80,.15)}

.readout{font-size:12px;line-height:1.7;color:var(--dim);font-variant-numeric:tabular-nums}
.readout .val{color:var(--text);font-weight:600}
.readout .pass{color:var(--green);font-weight:700}
.readout .fail{color:var(--red);font-weight:700}

.questions{font-size:12px;line-height:1.7;color:var(--dim)}
.questions li{margin-bottom:6px;padding-left:4px}
.questions li::marker{color:var(--accent)}

.progress-track{width:100%;height:4px;background:var(--border);border-radius:2px;overflow:hidden;margin-top:4px}
.progress-fill{height:100%;background:var(--accent);border-radius:2px;width:0%;transition:width 50ms linear}

.svg-text{font-family:'Segoe UI',system-ui,sans-serif}
</style>
</head>
<body>

<div class="title-bar">
  <span class="tag">C-J06</span>
  <span>圆周角定理 · Inscribed Angle Theorem</span>
</div>

<div class="main">
  <!-- SVG Canvas -->
  <div class="svg-wrap">
    <svg id="canvas" viewBox="0 0 1000 720" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <radialGradient id="bg-grad" cx="50%" cy="50%" r="55%">
          <stop offset="0%" stop-color="#162a38"/>
          <stop offset="100%" stop-color="#0d151e"/>
        </radialGradient>
        <filter id="glow">
          <feGaussianBlur stdDeviation="3" result="blur"/>
          <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
        <filter id="glow-strong">
          <feGaussianBlur stdDeviation="5" result="blur"/>
          <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
      </defs>
      <rect width="1000" height="720" fill="url(#bg-grad)"/>

      <!-- Grid hints -->
      <g id="grid" opacity=".06" stroke="#4fc3f7" stroke-width=".5">
        <line x1="500" y1="0" x2="500" y2="720"/>
        <line x1="0" y1="360" x2="1000" y2="360"/>
      </g>

      <!-- Arc highlight (the subtended arc) -->
      <path id="arc-highlight" fill="none" stroke="rgba(79,195,247,0.15)" stroke-width="48" stroke-linecap="round"/>

      <!-- Central angle lines: OA, OB -->
      <line id="line-OA" stroke="#ff8a65" stroke-width="2.5" stroke-linecap="round"/>
      <line id="line-OB" stroke="#ff8a65" stroke-width="2.5" stroke-linecap="round"/>

      <!-- Central angle arc -->
      <path id="central-arc" fill="none" stroke="#ff8a65" stroke-width="2.5" stroke-linecap="round"/>

      <!-- Inscribed angle lines: PA, PB -->
      <line id="line-PA" stroke="#4fc3f7" stroke-width="2.5" stroke-linecap="round"/>
      <line id="line-PB" stroke="#4fc3f7" stroke-width="2.5" stroke-linecap="round"/>

      <!-- Inscribed angle arc -->
      <path id="inscribed-arc" fill="none" stroke="#4fc3f7" stroke-width="2.5" stroke-linecap="round"/>

      <!-- Angle labels -->
      <text id="label-central" class="svg-text" fill="#ff8a65" font-size="15" font-weight="700" text-anchor="middle"></text>
      <text id="label-inscribed" class="svg-text" fill="#4fc3f7" font-size="15" font-weight="700" text-anchor="middle"></text>

      <!-- Dashed reference line AB -->
      <line id="line-AB" stroke="rgba(255,255,255,0.15)" stroke-width="1.5" stroke-dasharray="6,4"/>

      <!-- Circle -->
      <circle id="main-circle" cx="500" cy="360" r="280" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="1.5"/>

      <!-- Point labels -->
      <text id="label-O" class="svg-text" fill="#aaa" font-size="14" font-weight="600"></text>
      <text id="label-A" class="svg-text" fill="#ff8a65" font-size="14" font-weight="700"></text>
      <text id="label-B" class="svg-text" fill="#ff8a65" font-size="14" font-weight="700"></text>
      <text id="label-P" class="svg-text" fill="#4fc3f7" font-size="15" font-weight="700" filter="url(#glow)"></text>

      <!-- Points -->
      <circle id="point-O" cx="500" cy="360" r="5" fill="#aaa"/>
      <circle id="point-A" r="7" fill="#ff8a65" filter="url(#glow)"/>
      <circle id="point-B" r="7" fill="#ff8a65" filter="url(#glow)"/>
      <circle id="point-P" r="9" fill="#4fc3f7" filter="url(#glow-strong)" style="cursor:grab"/>

      <!-- Title inside SVG -->
      <text x="500" y="32" class="svg-text" fill="rgba(255,255,255,0.5)" font-size="13" font-weight="600" text-anchor="middle" letter-spacing="1">圆周角 = ½ 圆心角</text>

      <!-- Equality badge -->
      <g id="equality-badge" opacity="0">
        <rect x="420" y="660" width="160" height="34" rx="17" fill="rgba(102,187,106,0.15)" stroke="var(--green)" stroke-width="1.5"/>
        <text id="eq-badge-text" x="500" y="682" class="svg-text" fill="#66bb6a" font-size="13" font-weight="700" text-anchor="middle">∠APB = ½ ∠AOB ✓</text>
      </g>
    </svg>
  </div>

  <!-- Right Panel -->
  <div class="panel">
    <!-- Controls -->
    <div class="card">
      <div class="section-title">参数控制</div>
      <div class="slider-group" style="margin-top:8px">
        <div class="slider-label"><span>点 A 位置 (弧度)</span><span id="val-A">0°</span></div>
        <input type="range" id="slider-A" min="0" max="359" value="30" step="1">
      </div>
      <div class="slider-group" style="margin-top:6px">
        <div class="slider-label"><span>点 B 位置 (弧度)</span><span id="val-B">180°</span></div>
        <input type="range" id="slider-B" min="0" max="359" value="180" step="1">
      </div>
      <div class="slider-group" style="margin-top:6px">
        <div class="slider-label"><span>动画速度</span><span id="val-speed">1×</span></div>
        <input type="range" id="slider-speed" min="0.2" max="3" value="1" step="0.1">
      </div>
      <div class="progress-track"><div class="progress-fill" id="progress"></div></div>
    </div>

    <!-- Buttons -->
    <div class="card">
      <div class="section-title">播放控制</div>
      <div class="btn-row" style="margin-top:8px">
        <button class="btn primary" id="btn-play" title="Space">▶ Play</button>
        <button class="btn" id="btn-pause" title="Space">⏸ Pause</button>
      </div>
      <div class="btn-row" style="margin-top:6px">
        <button class="btn" id="btn-step" title="→">⏭ Step</button>
        <button class="btn danger" id="btn-reset" title="R">↺ Reset</button>
      </div>
      <div class="btn-row" style="margin-top:6px">
        <button class="btn" id="btn-reverse">⏪ Reverse</button>
        <button class="btn" id="btn-copy" title="Copy link">🔗 Copy Link</button>
      </div>
    </div>

    <!-- Readout -->
    <div class="card">
      <div class="section-title">实时数据</div>
      <div class="readout" style="margin-top:6px" id="readout">
        <div>∠AOB (圆心角): <span class="val" id="ro-central">—</span></div>
        <div>∠APB (圆周角): <span class="val" id="ro-inscribed">—</span></div>
        <div>½ ∠AOB: <span class="val" id="ro-half">—</span></div>
        <div>差值: <span class="val" id="ro-diff">—</span></div>
        <div>验证: <span id="ro-verify">—</span></div>
      </div>
    </div>

    <!-- Verify -->
    <div class="card">
      <div class="section-title">定理验证</div>
      <div style="margin-top:6px">
        <button class="btn" id="btn-verify" style="width:100%">🔍 验证 ∠APB = ½ ∠AOB</button>
        <div id="verify-result" style="margin-top:8px;font-size:12px;line-height:1.6;color:var(--dim);min-height:20px"></div>
      </div>
    </div>

    <!-- Classroom -->
    <div class="card">
      <div class="section-title">课堂思考</div>
      <ol class="questions" style="margin-top:6px">
        <li>当点 P 在优弧上移动时，∠APB 的大小如何变化？</li>
        <li>若 A、B 两点重合，圆周角和圆心角分别是多少？</li>
        <li>同弧上的圆周角相等吗？请拖动 P 验证。</li>
        <li>圆内接四边形的对角有什么关系？</li>
      </ol>
    </div>
  </div>
</div>

<script>
(function(){
  'use strict';

  const CX=500, CY=360, R=280;
  const DEG=Math.PI/180;
  const TWO_PI=2*Math.PI;

  const $ = id => document.getElementById(id);

  const els = {
    lineOA:$('line-OA'), lineOB:$('line-OB'),
    linePA:$('line-PA'), linePB:$('line-PB'),
    centralArc:$('central-arc'), inscribedArc:$('inscribed-arc'),
    arcHighlight:$('arc-highlight'),
    lineAB:$('line-AB'),
    pointA:$('point-A'), pointB:$('point-B'), pointP:$('point-P'),
    labelO:$('label-O'), labelA:$('label-A'), labelB:$('label-B'), labelP:$('label-P'),
    labelCentral:$('label-central'), labelInscribed:$('label-inscribed'),
    badge:$('equality-badge'), eqBadgeText:$('eq-badge-text'),
    sliderA:$('slider-A'), sliderB:$('slider-B'), sliderSpeed:$('slider-speed'),
    valA:$('val-A'), valB:$('val-B'), valSpeed:$('val-speed'),
    btnPlay:$('btn-play'), btnPause:$('btn-pause'), btnStep:$('btn-step'),
    btnReset:$('btn-reset'), btnReverse:$('btn-reverse'), btnCopy:$('btn-copy'),
    btnVerify:$('btn-verify'), verifyResult:$('verify-result'),
    progress:$('progress'),
    roCentral:$('ro-central'), roInscribed:$('ro-inscribed'),
    roHalf:$('ro-half'), roDiff:$('ro-diff'), roVerify:$('ro-verify'),
  };

  const state = {
    arcA: 30,
    arcB: 180,
    pAngle: 90, // current P angle (degrees, 0-360)
    playing: false,
    reverse: false,
    speed: 1,
    animFrame: null,
    lastTime: 0,
    isReady: false,
  };

  function degToRad(d){ return d * DEG; }
  function radToDeg(r){ return r / DEG; }

  function pointOnCircle(angleDeg){
    const r = degToRad(angleDeg);
    return { x: CX + R * Math.cos(r), y: CY - R * Math.sin(r) };
  }

  function normalizeAngle(a){
    while(a < 0) a += 360;
    while(a >= 360) a -= 360;
    return a;
  }

  function angleBetween(from, to){
    let d = normalizeAngle(to - from);
    if(d > 180) d = 360 - d;
    return d;
  }

  function angleMidpoint(from, to){
    let diff = normalizeAngle(to - from);
    if(diff > 180) diff = diff - 360;
    return normalizeAngle(from + diff / 2);
  }

  function arcPath(cx, cy, r, startDeg, endDeg, largeArc){
    const s = degToRad(startDeg);
    const e = degToRad(endDeg);
    const sx = cx + r * Math.cos(s);
    const sy = cy - r * Math.sin(s);
    const ex = cx + r * Math.cos(e);
    const ey = cy - r * Math.sin(e);
    const la = largeArc ? 1 : 0;
    return `M${sx.toFixed(2)},${sy.toFixed(2)} A${r},${r} 0 ${la} 0 ${ex.toFixed(2)},${ey.toFixed(2)}`;
  }

  // Central angle ∠AOB
  function centralAngleDeg(){
    return angleBetween(state.arcA, state.arcB);
  }

  // Compute ∠APB using vectors PA and PB
  function computeInscribedAngle(){
    const p = pointOnCircle(state.pAngle);
    const a = pointOnCircle(state.arcA);
    const b = pointOnCircle(state.arcB);

    const vpa = { x: a.x - p.x, y: a.y - p.y };
    const vpb = { x: b.x - p.x, y: b.y - p.y };

    const dot = vpa.x * vpb.x + vpa.y * vpb.y;
    const cross = vpa.x * vpb.y - vpa.y * vpb.x;
    let angle = Math.atan2(Math.abs(cross), dot);
    return radToDeg(angle);
  }

  // For central angle, compute ∠AOB
  function computeCentralAngle(){
    const a = pointOnCircle(state.arcA);
    const b = pointOnCircle(state.arcB);

    const voa = { x: a.x - CX, y: a.y - CY };
    const vob = { x: b.x - CX, y: b.y - CY };

    const dot = voa.x * vob.x + voa.y * vob.y;
    const cross = voa.x * vob.y - voa.y * vob.x;
    let angle = Math.atan2(Math.abs(cross), dot);
    return radToDeg(angle);
  }

  function update(){
    const aPos = pointOnCircle(state.arcA);
    const bPos = pointOnCircle(state.arcB);
    const pPos = pointOnCircle(state.pAngle);

    // Points
    els.pointA.setAttribute('cx', aPos.x);
    els.pointA.setAttribute('cy', aPos.y);
    els.pointB.setAttribute('cx', bPos.x);
    els.pointB.setAttribute('cy', bPos.y);
    els.pointP.setAttribute('cx', pPos.x);
    els.pointP.setAttribute('cy', pPos.y);

    // Labels
    els.labelO.setAttribute('x', CX + 12);
    els.labelO.setAttribute('y', CY + 18);
    els.labelO.textContent = 'O';

    const aLabelPos = pointOnCircle(state.arcA);
    const aOff = getLabelOffset(state.arcA);
    els.labelA.setAttribute('x', aLabelPos.x + aOff.x);
    els.labelA.setAttribute('y', aLabelPos.y + aOff.y);
    els.labelA.textContent = 'A';

    const bLabelPos = pointOnCircle(state.arcB);
    const bOff = getLabelOffset(state.arcB);
    els.labelB.setAttribute('x', bLabelPos.x + bOff.x);
    els.labelB.setAttribute('y', bLabelPos.y + bOff.y);
    els.labelB.textContent = 'B';

    const pLabelPos = pointOnCircle(state.pAngle);
    const pOff = getLabelOffset(state.pAngle);
    els.labelP.setAttribute('x', pLabelPos.x + pOff.x);
    els.labelP.setAttribute('y', pLabelPos.y + pOff.y);
    els.labelP.textContent = 'P';

    // Lines
    setLine(els.lineOA, CX, CY, aPos.x, aPos.y);
    setLine(els.lineOB, CX, CY, bPos.x, bPos.y);
    setLine(els.linePA, pPos.x, pPos.y, aPos.x, aPos.y);
    setLine(els.linePB, pPos.x, pPos.y, bPos.x, bPos.y);
    setLine(els.lineAB, aPos.x, aPos.y, bPos.x, bPos.y);

    // Central angle arc
    const central = computeCentralAngle();
    const centralMid = angleMidpoint(state.arcA, state.arcB);
    const centralLargeArc = central > 180 ? 1 : 0;
    // Determine sweep direction
    let caStart, caEnd;
    let aToB = normalizeAngle(state.arcB - state.arcA);
    if(aToB > 180){
      caStart = state.arcB;
      caEnd = state.arcA;
    } else {
      caStart = state.arcA;
      caEnd = state.arcB;
    }
    const caArcR = 40;
    els.centralArc.setAttribute('d', arcPath(CX, CY, caArcR, caStart, caEnd, central > 180));

    // Central angle label position
    const cLabelAngle = degToRad(centralMid);
    const cLabelR = caArcR + 18;
    els.labelCentral.setAttribute('x', CX + cLabelR * Math.cos(cLabelAngle));
    els.labelCentral.setAttribute('y', CY - cLabelR * Math.sin(cLabelAngle) + 5);
    els.labelCentral.textContent = central.toFixed(1) + '°';

    // Inscribed angle arc
    const inscribed = computeInscribedAngle();
    const iaArcR = 35;

    // Direction from P to A and P to B
    const angPA = radToDeg(Math.atan2(-(aPos.y - pPos.y), aPos.x - pPos.x));
    const angPB = radToDeg(Math.atan2(-(bPos.y - pPos.y), bPos.x - pPos.x));

    let iaStart, iaEnd;
    let paToPb = normalizeAngle(angPB - angPA);
    if(paToPb > 180){
      iaStart = angPB;
      iaEnd = angPA;
    } else {
      iaStart = angPA;
      iaEnd = angPB;
    }

    els.inscribedArc.setAttribute('d', arcPath(pPos.x, pPos.y, iaArcR, iaStart, iaEnd, inscribed > 180));

    // Inscribed angle label
    const iLabelAngle = degToRad(angleMidpoint(normalizeAngle(-angPA), normalizeAngle(-angPB)));
    // Simpler: just put label between PA and PB directions
    const iMidDir = normalizeAngle((angPA + angPB) / 2);
    const iLabelR = iaArcR + 20;
    const iMidRad = degToRad(iMidDir);
    els.labelInscribed.setAttribute('x', pPos.x + iLabelR * Math.cos(iMidRad));
    els.labelInscribed.setAttribute('y', pPos.y - iLabelR * Math.sin(iMidRad) + 5);
    els.labelInscribed.textContent = inscribed.toFixed(1) + '°';

    // Arc highlight (the arc from A to B not containing P)
    const arcFrom = state.arcA;
    const arcTo = state.arcB;
    let aToB2 = normalizeAngle(state.arcB - state.arcA);
    // We want the arc NOT containing P
    // Check if P is in the arc from A to B going CCW
    const pInArcCCW = normalizeAngle(state.pAngle - state.arcA) < aToB2;
    if(pInArcCCW){
      // P is in CCW arc from A to B, so highlight the CW arc (B to A)
      els.arcHighlight.setAttribute('d', arcPath(CX, CY, R, state.arcB, normalizeAngle(state.arcA), true));
    } else {
      els.arcHighlight.setAttribute('d', arcPath(CX, CY, R, state.arcA, normalizeAngle(state.arcB), aToB2 > 180));
    }

    // Readout
    const halfCentral = central / 2;
    const diff = Math.abs(inscribed - halfCentral);
    els.roCentral.textContent = central.toFixed(1) + '°';
    els.roInscribed.textContent = inscribed.toFixed(1) + '°';
    els.roHalf.textContent = halfCentral.toFixed(1) + '°';
    els.roDiff.textContent = diff.toFixed(2) + '°';
    const verified = diff < 0.5;
    els.roVerify.innerHTML = verified
      ? '<span class="pass">✓ 成立</span>'
      : '<span class="fail">— 验证中</span>';

    // Badge
    els.badge.setAttribute('opacity', verified ? '1' : '0.3');
    els.eqBadgeText.textContent = verified ? '∠APB = ½ ∠AOB ✓' : '∠APB ≈ ½ ∠AOB';

    // Progress (based on P position in full circle)
    els.progress.style.width = (state.pAngle / 360 * 100).toFixed(1) + '%';
  }

  function getLabelOffset(angleDeg){
    const r = degToRad(angleDeg);
    const nx = Math.cos(r);
    const ny = -Math.sin(r);
    const d = 18;
    return { x: nx * d, y: ny * d + 5 };
  }

  function setLine(el, x1, y1, x2, y2){
    el.setAttribute('x1', x1);
    el.setAttribute('y1', y1);
    el.setAttribute('x2', x2);
    el.setAttribute('y2', y2);
  }

  // Animation
  function animate(timestamp){
    if(!state.playing) return;
    if(!state.lastTime) state.lastTime = timestamp;
    const dt = (timestamp - state.lastTime) / 1000;
    state.lastTime = timestamp;

    const dir = state.reverse ? -1 : 1;
    state.pAngle = normalizeAngle(state.pAngle + dir * 60 * state.speed * dt);

    // Sync slider
    els.sliderA.value = state.arcA;
    els.sliderB.value = state.arcB;
    update();

    state.animFrame = requestAnimationFrame(animate);
  }

  function play(){
    if(state.playing) return;
    state.playing = true;
    state.reverse = false;
    state.lastTime = 0;
    els.btnPlay.textContent = '▶ Playing…';
    state.animFrame = requestAnimationFrame(animate);
  }

  function pause(){
    state.playing = false;
    if(state.animFrame) cancelAnimationFrame(state.animFrame);
    els.btnPlay.textContent = '▶ Play';
  }

  function step(){
    pause();
    state.pAngle = normalizeAngle(state.pAngle + 2);
    update();
  }

  function reverse(){
    if(state.playing){
      state.reverse = !state.reverse;
    } else {
      state.reverse = true;
      play();
    }
  }

  function reset(){
    pause();
    state.arcA = 30;
    state.arcB = 180;
    state.pAngle = 90;
    state.speed = 1;
    els.sliderA.value = 30;
    els.sliderB.value = 180;
    els.sliderSpeed.value = 1;
    update();
    readURLParams();
  }

  function verify(){
    const central = computeCentralAngle();
    const inscribed = computeInscribedAngle();
    const half = central / 2;
    const diff = Math.abs(inscribed - half);
    const pass = diff < 0.5;

    els.verifyResult.innerHTML =
      `<div style="margin-bottom:4px"><b>证明过程:</b></div>` +
      `<div>∠AOB = <b>${central.toFixed(1)}°</b></div>` +
      `<div>∠APB = <b>${inscribed.toFixed(1)}°</b></div>` +
      `<div>½ × ∠AOB = <b>${half.toFixed(1)}°</b></div>` +
      `<div style="margin-top:4px">|∠APB − ½∠AOB| = <b>${diff.toFixed(2)}°</b></div>` +
      `<div style="margin-top:6px;font-weight:700;color:${pass?'#66bb6a':'#ef5350'}">` +
      `${pass ? '✓ 定理成立：圆周角等于同弧上圆心角的一半' : '⚠ 数值偏差较大，请调整参数'}</div>`;
  }

  function setParams(params){
    if(params !== undefined){
      if(typeof params.arcA === 'number'){
        state.arcA = normalizeAngle(params.arcA);
        els.sliderA.value = state.arcA;
      }
      if(typeof params.arcB === 'number'){
        state.arcB = normalizeAngle(params.arcB);
        els.sliderB.value = state.arcB;
      }
    }
    update();
  }

  function writeURLParams(){
    const u = new URL(window.location.href);
    u.searchParams.set('a', Math.round(state.arcA));
    u.searchParams.set('b', Math.round(state.arcB));
    u.searchParams.set('p', Math.round(state.pAngle));
    window.history.replaceState(null, '', u.toString());
  }

  function readURLParams(){
    const u = new URL(window.location.href);
    if(u.searchParams.has('a')){ state.arcA = parseInt(u.searchParams.get('a')) || 30; els.sliderA.value = state.arcA; }
    if(u.searchParams.has('b')){ state.arcB = parseInt(u.searchParams.get('b')) || 180; els.sliderB.value = state.arcB; }
    if(u.searchParams.has('p')){ state.pAngle = parseInt(u.searchParams.get('p')) || 90; }
    update();
  }

  function copyLink(){
    writeURLParams();
    navigator.clipboard.writeText(window.location.href).then(()=>{
      els.btnCopy.textContent = '✓ Copied!';
      setTimeout(()=>{ els.btnCopy.textContent = '🔗 Copy Link'; }, 1500);
    }).catch(()=>{
      els.btnCopy.textContent = '⚠ Failed';
      setTimeout(()=>{ els.btnCopy.textContent = '🔗 Copy Link'; }, 1500);
    });
  }

  // Slider events
  els.sliderA.addEventListener('input', ()=>{
    state.arcA = parseFloat(els.sliderA.value);
    els.valA.textContent = Math.round(state.arcA) + '°';
    writeURLParams();
    update();
  });
  els.sliderB.addEventListener('input', ()=>{
    state.arcB = parseFloat(els.sliderB.value);
    els.valB.textContent = Math.round(state.arcB) + '°';
    writeURLParams();
    update();
  });
  els.sliderSpeed.addEventListener('input', ()=>{
    state.speed = parseFloat(els.sliderSpeed.value);
    els.valSpeed.textContent = state.speed.toFixed(1) + '×';
  });

  // Button events
  els.btnPlay.addEventListener('click', play);
  els.btnPause.addEventListener('click', pause);
  els.btnStep.addEventListener('click', step);
  els.btnReset.addEventListener('click', reset);
  els.btnReverse.addEventListener('click', reverse);
  els.btnCopy.addEventListener('click', copyLink);
  els.btnVerify.addEventListener('click', verify);

  // Keyboard
  document.addEventListener('keydown', (e)=>{
    if(e.target.tagName === 'INPUT') return;
    if(e.code === 'Space'){ e.preventDefault(); state.playing ? pause() : play(); }
    else if(e.code === 'ArrowRight'){ e.preventDefault(); step(); }
    else if(e.code === 'KeyR'){ e.preventDefault(); reset(); }
  });

  // Drag P on SVG
  let dragging = false;
  const svgEl = $('canvas');

  function svgPoint(evt){
    const rect = svgEl.getBoundingClientRect();
    const vb = svgEl.viewBox.baseVal;
    const sx = vb.width / rect.width;
    const sy = vb.height / rect.height;
    const clientX = evt.touches ? evt.touches[0].clientX : evt.clientX;
    const clientY = evt.touches ? evt.touches[0].clientY : evt.clientY;
    return {
      x: (clientX - rect.left) * sx,
      y: (clientY - rect.top) * sy
    };
  }

  function onDragStart(evt){
    dragging = true;
    pause();
    els.pointP.style.cursor = 'grabbing';
    onDragMove(evt);
  }
  function onDragMove(evt){
    if(!dragging) return;
    evt.preventDefault();
    const pt = svgPoint(evt);
    const angle = normalizeAngle(radToDeg(Math.atan2(-(pt.y - CY), pt.x - CX)));
    state.pAngle = angle;
    update();
  }
  function onDragEnd(){
    dragging = false;
    els.pointP.style.cursor = 'grab';
  }

  els.pointP.addEventListener('mousedown', onDragStart);
  els.pointP.addEventListener('touchstart', onDragStart, {passive:false});
  document.addEventListener('mousemove', onDragMove);
  document.addEventListener('touchmove', onDragMove, {passive:false});
  document.addEventListener('mouseup', onDragEnd);
  document.addEventListener('touchend', onDragEnd);

  // SciDemo API
  window.SciDemo = {
    setParams: setParams,
    play: play,
    pause: pause,
    step: step,
    reset: reset,
    reverse: reverse,
    verify: verify,
    get state(){ return JSON.parse(JSON.stringify(state)); },
    get isReady(){ return state.isReady; }
  };

  // Init
  readURLParams();
  state.isReady = true;
  update();

})();
</script>
</body>
</html>
