<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>C-B01 黎曼和逼近定积分 · 大数学交互交付</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#f6f7f9; color:#1f2430; font-family:"Microsoft YaHei","PingFang SC",system-ui,sans-serif; min-height:100vh; }
  .wrap { max-width:1180px; margin:0 auto; padding:18px 16px 30px; }
  h1 { font-size:22px; margin-bottom:4px; }
  .sub { color:#6b7280; font-size:13px; margin-bottom:14px; }
  .layout { display:grid; grid-template-columns:1fr 330px; gap:16px; }
  .stage { background:#fff; border:1px solid #e3e6ec; border-radius:12px; padding:8px; box-shadow:0 1px 3px rgba(0,0,0,.05); }
  svg { width:100%; height:auto; display:block; }
  .panel { display:flex; flex-direction:column; gap:12px; }
  .box { background:#fff; border:1px solid #e3e6ec; border-radius:12px; padding:12px 14px; }
  .box h3 { font-size:14px; margin-bottom:8px; color:#374151; }
  .ctl { margin-bottom:10px; }
  .ctl label { display:flex; justify-content:space-between; font-size:13px; margin-bottom:3px; }
  .ctl label b { color:#2563eb; }
  .ctl input[type=range] { width:100%; }
  .btnrow { display:grid; grid-template-columns:1fr 1fr 1fr; gap:7px; }
  button { border:none; border-radius:8px; padding:9px 0; font-size:14px; cursor:pointer; background:#eef1f6; color:#1f2430; }
  button:hover { background:#e2e8f0; }
  button.pri { background:#2563eb; color:#fff; }
  button.pri:hover { background:#1d4ed8; }
  button.on { background:#2563eb; color:#fff; }
  .readout { font-size:13px; line-height:1.75; }
  .readout .big { font-size:15px; font-weight:700; color:#1f2430; }
  .ok { color:#059669; font-weight:700; }
  .msg { font-size:12px; color:#6b7280; line-height:1.6; }
  .q { font-size:12px; color:#6b7280; border-top:1px dashed #e3e6ec; padding-top:8px; margin-top:4px; }
  .q b { color:#374151; }
  @media (max-width:880px){ .layout{ grid-template-columns:1fr; } }
</style>
</head>
<body>
<div class="wrap">
  <h1>C-B01 · 黎曼和逼近定积分</h1>
  <p class="sub">把区间 [0,2] 分成 n 等份，用小矩形近似曲边梯形的面积。n 越大，左和 / 右和越贴近精确值 <b>∫<sub>0</sub><sup>2</sup> x<sup>2</sup> dx = 8/3 ≈ 2.667</b>。切换左右和看它们如何"夹逼"答案。</p>
  <div class="layout">
    <div class="stage">
      <svg id="scene" viewBox="0 0 1000 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="黎曼和逼近定积分"></svg>
    </div>
    <div class="panel">
      <div class="box">
        <h3>参数控制</h3>
        <div class="ctl"><label>等分数 n <b id="vn">4</b></label><input type="range" id="sn" min="1" max="64" step="1" value="4"></div>
        <div class="btnrow">
          <button id="btnL" class="on">◼ 左和</button>
          <button id="btnR">◻ 右和</button>
          <button id="btnCopy">🔗 复制参数链接</button>
        </div>
        <div class="btnrow" style="margin-top:7px">
          <button class="pri" id="btnPlay">▶ 演示 n 变大</button>
          <button id="btnStep">⏭ 单步 +n</button>
          <button id="btnReset">↺ 复位</button>
        </div>
      </div>
      <div class="box">
        <h3>实时数据</h3>
        <div class="readout" id="readout"></div>
      </div>
      <div class="box">
        <h3>课堂提问</h3>
        <div class="q"><b>先猜</b>：n=1 时一个矩形够不够准？n=64 时误差剩多少？<br><b>后问</b>：为什么左和总偏小、右和总偏大？"无穷多矩形"的面积，是不是就是曲边梯形的面积？</div>
      </div>
    </div>
  </div>
</div>
<script>
(function(){
"use strict";

var SVG_NS = "http://www.w3.org/2000/svg";
var W = 1000, H = 720, PAD = 50;
var X0 = 0, X1 = 2, Y0 = 0, Y1 = 4;
var svg = document.getElementById("scene");

var state = { n: 4, mode: "left", playing: false, lastTs: 0 };

function f(x){ return x * x; }
function sx(x){ return PAD + (x - X0) / (X1 - X0) * (W - PAD*2); }
function sy(y){ return H - PAD - (y - Y0) / (Y1 - Y0) * (H - PAD*2); }
function el(tag, attrs){
  var e = document.createElementNS(SVG_NS, tag);
  for (var k in attrs) e.setAttribute(k, attrs[k]);
  return e;
}
function clearSvg(){ while (svg.firstChild) svg.removeChild(svg.firstChild); }
function txt(x, y, text, color, size, weight){
  var t = el("text", { x:x, y:y, fill:color||"#374151", "font-size":size||13,
    "text-anchor":"middle", "font-weight":weight||"normal",
    "font-family":"'Microsoft YaHei','PingFang SC',sans-serif" });
  t.textContent = text;
  svg.appendChild(t);
  return t;
}
function richTxt(x, y, parts, color, size){
  var t = el("text", { x:x, y:y, fill:color||"#374151", "font-size":size||14,
    "text-anchor":"middle", "font-weight":"700", "font-family":"'Microsoft YaHei','PingFang SC',sans-serif" });
  parts.forEach(function(p){
    var n = el("tspan", {});
    if (p.sup) { n.setAttribute("baseline-shift","super"); n.setAttribute("font-size", size*0.62); }
    if (p.sub) { n.setAttribute("baseline-shift","sub"); n.setAttribute("font-size", size*0.62); }
    n.textContent = p.t;
    t.appendChild(n);
  });
  svg.appendChild(t);
  return t;
}
function fnum(x, d){ return x.toFixed(d === undefined ? 4 : d).replace(/0+$/, "").replace(/\.$/, ""); }

function sums(){
  var n = state.n, h = (X1 - X0) / n;
  var L = 0, R = 0;
  for (var i = 0; i < n; i++){
    L += f(X0 + i*h) * h;
    R += f(X0 + (i+1)*h) * h;
  }
  return { L: L, R: R, h: h };
}

function redraw(){
  clearSvg();
  var n = state.n, h = (X1 - X0) / n;
  var s = sums();

  // 网格 + 轴
  for (var gy = 0; gy <= Y1; gy++){
    svg.appendChild(el("line", { x1:sx(X0), y1:sy(gy), x2:sx(X1), y2:sy(gy), stroke:"#eef0f4", "stroke-width":1 }));
    txt(sx(X0)-16, sy(gy)+4, String(gy), "#94a3b8", 11);
  }
  svg.appendChild(el("line", { x1:sx(X0)-10, y1:sy(0), x2:sx(X1)+10, y2:sy(0), stroke:"#94a3b8", "stroke-width":2 }));
  svg.appendChild(el("line", { x1:sx(X0), y1:sy(Y1), x2:sx(X0), y2:sy(0), stroke:"#94a3b8", "stroke-width":1.5 }));

  // 矩形
  for (var i = 0; i < n; i++){
    var a = X0 + i*h;
    var ht = (state.mode === "left") ? f(a) : f(a + h);
    var rect = el("rect", { x:sx(a), y:sy(ht), width:sx(a+h)-sx(a), height:sy(0)-sy(ht),
      fill: (state.mode === "left" ? "#93c5fd" : "#fdba74"),
      stroke:"#2563eb", "stroke-width":1.2 });
    svg.appendChild(rect);
  }

  // 曲线 y=x²
  var path = "M";
  for (var x = X0; x <= X1; x += 0.02){
    path += (x === X0 ? "" : " L") + sx(x) + " " + sy(f(x));
  }
  svg.appendChild(el("path", { d:path, fill:"none", stroke:"#111827", "stroke-width":3.5, "stroke-linejoin":"round" }));

  // 标注区间端点 0 与 2
  txt(sx(0), sy(0)+18, "0", "#374151", 12, "bold");
  txt(sx(2), sy(0)+18, "2", "#374151", 12, "bold");
  txt(sx(1), sy(0)+34, "dx = " + fnum(h, 4), "#6b7280", 12);

  // 顶部横幅：∫₀² x² dx = 8/3（用 tspan 上/下标渲染）
  var banner = el("g", {});
  banner.appendChild(el("rect", { x:W-330, y:12, width:310, height:40, rx:8, fill:"#111827", opacity:0.85 }));
  var parts = [
    {t:"∫"}, {t:"0", sub:1}, {t:"2", sup:1},
    {t:" x"}, {t:"2", sup:1},
    {t:" dx = 8/3 ≈ 2.6667"}
  ];
  var bt = el("text", { x:W-175, y:38, fill:"#f8fafc", "font-size":17, "text-anchor":"middle",
    "font-weight":"700", "font-family":"'Microsoft YaHei','PingFang SC',sans-serif" });
  parts.forEach(function(p){
    var n = el("tspan", {});
    if (p.sup) { n.setAttribute("baseline-shift","super"); n.setAttribute("font-size", 10); }
    if (p.sub) { n.setAttribute("baseline-shift","sub"); n.setAttribute("font-size", 10); }
    n.textContent = p.t;
    bt.appendChild(n);
  });
  banner.appendChild(bt);
  svg.appendChild(banner);

  // 当前和标注（曲线旁小标签）
  var cur = state.mode === "left" ? s.L : s.R;
  var note = state.mode === "left" ? "左和 L" + n + " =" : "右和 R" + n + " =";
  richTxt(W/2, 30, [{t:note}, {t: fnum(cur, 5)}], "#1d4ed8", 26);

  updateReadout();
}

function updateReadout(){
  var n = state.n;
  var s = sums();
  var target = 8/3;
  var dL = Math.abs(s.L - target), dR = Math.abs(s.R - target);
  var el2 = document.getElementById("readout");
  var modeName = state.mode === "left" ? "左和（取每小段左端点高度）" : "右和（取每小段右端点高度）";
  el2.innerHTML =
    '<div class="big">' + (state.mode === "left" ? "L" : "R") + '<sub>' + n + '</sub> = ' + fnum(state.mode === "left" ? s.L : s.R, 6) + '</div>' +
    '<div>左和 L<sub>' + n + '</sub> = ' + fnum(s.L, 6) + '</div>' +
    '<div>右和 R<sub>' + n + '</sub> = ' + fnum(s.R, 6) + '</div>' +
    '<div>精确值 ∫<sub>0</sub><sup>2</sup> x<sup>2</sup> dx = <b>8/3 ≈ 2.6667</b></div>' +
    '<div>误差（当前模式）：<b class="' + (dL < 0.01 || dR < 0.01 ? "ok" : "") + '">' + fnum(state.mode === "left" ? dL : dR, 6) + '</b>' + ((dL < 0.01 || dR < 0.01) ? ' ✓ 已接近精确值' : '') + '</div>' +
    '<div class="msg">' + modeName + '。n 翻倍时误差约除以 2——矩形越细，上下和把 8/3"夹"得越紧。</div>';
}

/* ---------- 动画：n 递增演示 ---------- */
function frame(ts){
  if (!state.playing) return;
  var dt = state.lastTs ? (ts - state.lastTs) / 1000 : 0;
  state.lastTs = ts;
  var step = dt > 0 ? Math.max(1, Math.round(dt * 18)) : 1;
  state.n = Math.min(64, state.n + step);
  if (state.n >= 64){ state.n = 64; state.playing = false; }
  sn.value = state.n; vn.textContent = state.n;
  redraw();
  if (state.playing) requestAnimationFrame(frame);
}
function play(){
  state.playing = true;
  if (state.n >= 64) state.n = 1;
  state.lastTs = 0;
  requestAnimationFrame(frame);
}
function step(){ state.playing = false; state.n = Math.min(64, state.n + 4); sn.value = state.n; vn.textContent = state.n; redraw(); }
function resetAll(){ state.playing = false; state.n = 4; sn.value = state.n; vn.textContent = state.n; redraw(); }

function setParams(p){
  if (p.n !== undefined){
    state.n = Math.max(1, Math.min(64, Math.round(p.n)));
    sn.value = state.n; vn.textContent = state.n;
  }
  if (p.mode !== undefined && (p.mode === "left" || p.mode === "right")) state.mode = p.mode;
  syncModeButtons();
  resetAll();
}

document.getElementById("btnL").onclick = function(){ state.mode = "left"; syncModeButtons(); resetAll(); };
document.getElementById("btnR").onclick = function(){ state.mode = "right"; syncModeButtons(); resetAll(); };
function syncModeButtons(){
  document.getElementById("btnL").className = state.mode === "left" ? "on" : "";
  document.getElementById("btnR").className = state.mode === "right" ? "on" : "";
}
document.getElementById("btnPlay").onclick  = play;
document.getElementById("btnStep").onclick  = step;
document.getElementById("btnReset").onclick = resetAll;
document.getElementById("btnCopy").onclick = function(){
  var u = new URL(location.href);
  u.searchParams.set("n", state.n); u.searchParams.set("mode", state.mode);
  var s = u.href;
  if (navigator.clipboard) navigator.clipboard.writeText(s).then(function(){ alert("链接已复制"); });
  else { prompt("复制链接", s); }
};

var sn = document.getElementById("sn"), vn = document.getElementById("vn");
sn.oninput = function(){ state.n = +sn.value; vn.textContent = state.n; state.playing = false; redraw(); };

document.addEventListener("keydown", function(e){
  if (e.key === " ") { e.preventDefault(); if (state.playing) state.playing = false; else play(); }
  else if (e.key === "ArrowRight") { step(); }
  else if (e.key === "r" || e.key === "R") { resetAll(); }
});

/* ---------- 初始化 + URL ---------- */
(function init(){
  var q = new URLSearchParams(location.search);
  var n = parseInt(q.get("n"), 10);
  var mode = q.get("mode");
  if (Number.isInteger(n) && n >= 1 && n <= 64) state.n = n;
  if (mode === "left" || mode === "right") state.mode = mode;
  sn.value = state.n; vn.textContent = state.n;
  syncModeButtons();
  redraw();
})();

/* ---------- 质检钩子 ---------- */
function verify(){
  var s = sums();
  var target = 8/3;
  var rects = svg.querySelectorAll("rect");
  var inRange = rects.length === state.n + 2; // n 个矩形 + 1 个横幅背景? 横幅用 g>rect，仍在查询中
  return {
    mode:"integral", n:state.n,
    leftBelow: s.L <= target + 1e-9,
    rightAbove: s.R >= target - 1e-9,
    bracketExact: s.L <= target && target <= s.R,
    narrowDelta: s.R - s.L,
    sumMode: state.mode
  };
}

window.SciDemo = {
  setParams: setParams,
  play: play,
  pause: function(){ state.playing = false; },
  step: step,
  reset: resetAll,
  reverse: function(){ state.playing = false; state.n = Math.max(1, state.n - 4); sn.value = state.n; vn.textContent = state.n; redraw(); },
  verify: verify,
  state: function(){ return { n: state.n, mode: state.mode, playing: state.playing }; }
};
Object.defineProperty(window.SciDemo, "isReady", { get: function(){ return true; } });

})();
</script>
</body>
</html>
